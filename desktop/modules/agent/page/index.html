<script>
  /* Gaziyav's theme (its «Вид → Оформление» drives the system's colour scheme in every page of the app) before the first paint */
  (function () {
    var m = matchMedia('(prefers-color-scheme: dark)');
    var set = function () { document.documentElement.dataset.theme = m.matches ? 'dark' : 'light'; };
    set();
    m.addEventListener('change', set);
  })();
</script>
